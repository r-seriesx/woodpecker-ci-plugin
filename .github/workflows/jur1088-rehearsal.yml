name: JUR-1088 pack-only rehearsal

on:
  push:
    branches:
      - rehearsal/jur-1088

permissions:
  contents: read

jobs:
  rehearse:
    if: github.repository == 'r-seriesx/woodpecker-ci-plugin' && github.repository_id == '1372674879' && github.ref == 'refs/heads/rehearsal/jur-1088'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify exact Woodpecker check
        run: bun scripts/ci/woodpecker-rehearsal-proof.ts
      - name: Install zsh for the package checks
        run: |
          if ! test -x /bin/zsh; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zsh
          fi
          test -x /bin/zsh
      - name: Build and verify an unpublished tarball
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun install --frozen-lockfile
          bun run check
          pack_dir=$(mktemp -d)
          trap 'rm -rf -- "$pack_dir"' EXIT
          mkdir "$pack_dir/src"
          git archive "$GITHUB_SHA" | tar -x -C "$pack_dir/src"
          cp -R dist "$pack_dir/src/dist"
          node - "$pack_dir/src/package.json" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          Object.assign(pkg, {
            name: "@r-seriesx/woodpecker-ci-plugin",
            version: "2.1.7-jur1088-dryrun.1",
            repository: { type: "git", url: "git+https://github.com/r-seriesx/woodpecker-ci-plugin.git" },
          });
          delete pkg.publishConfig;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm pack "$pack_dir/src" --ignore-scripts --pack-destination "$pack_dir"
          archive="$pack_dir/r-seriesx-woodpecker-ci-plugin-2.1.7-jur1088-dryrun.1.tgz"
          tar -xOf "$archive" package/package.json | jq -ce '
            select(.name == "@r-seriesx/woodpecker-ci-plugin"
              and .version == "2.1.7-jur1088-dryrun.1"
              and .repository.url == "git+https://github.com/r-seriesx/woodpecker-ci-plugin.git")
            | {name, version, repository}'
          printf 'Source SHA: %s\n' "$GITHUB_SHA"
          sha512sum "$archive" | cut -d ' ' -f 1
